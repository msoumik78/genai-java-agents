spring:
  application:
    name: genai-java-agents
  datasource:
    url: jdbc:h2:file:./data/agent-runs;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  ai:
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      chat:
        options:
          model: qwen2.5:7b
          temperature: 0
    retry:
      max-attempts: 1

agent:
  max-iterations: 8
  max-total-tokens: 8000
  max-identical-tool-calls: 3
  max-refund-amount: 200
  keep-recent-messages: 8
  tool-result-max-chars: 180

llm:
  permits-per-second: 5
  max-concurrent-calls: 2
  timeout: 90s
  retry-attempts: 2
